<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard de Ventas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6FA;--card:#fff;--border:#DDE1ED;--bg2:#EEF0F6;
  --text:#1A1D2E;--muted:#6B7080;
  --c-tienda:#1D4ED8;--c-crm:#059669;--c-ap:#6D28D9;--c-taller:#B91C1C;--c-ml:#D97706;
  --c-green:#059669;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.5;}
.shell{max-width:1200px;margin:0 auto;padding:1.5rem 1.5rem 5rem;}

.hdr{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:1.25rem;border-bottom:2px solid var(--border);margin-bottom:1.75rem;gap:1rem;flex-wrap:wrap;}
.hdr h1{font-size:21px;font-weight:700;letter-spacing:-.3px;}
.hdr p{font-size:13px;color:var(--muted);margin-top:3px;}
.hdr-r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.pill{font-size:12px;padding:5px 13px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;}
.pill.on{background:var(--text);color:#fff;border-color:var(--text);}

#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--c-tienda);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{color:var(--muted);font-size:14px;}
#err{display:none;padding:3rem;text-align:center;color:#B91C1C;font-size:14px;}

.tab-bar{display:flex;border-bottom:2px solid var(--border);margin-bottom:1.75rem;overflow-x:auto;}
.tab{font-size:14px;font-weight:500;padding:9px 18px;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s;}
.tab.on{color:var(--text);font-weight:700;border-bottom-color:var(--text);}
.tab-panel{display:none;}
.tab-panel.on{display:block;}

.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.75rem;}
.mc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;}
.mc-l{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.mc-v{font-size:22px;font-weight:700;line-height:1.2;}
.mc-s{font-size:12px;color:var(--muted);margin-top:3px;}

.dep-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.75rem;}
.dep-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;}
.dep-tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;margin-bottom:7px;}
.dt{background:#DBEAFE;color:#1D4ED8;}.dc{background:#D1FAE5;color:#065F46;}
.da{background:#EDE9FE;color:#5B21B6;}.dtl{background:#FEE2E2;color:#991B1B;}
.dm{background:#FEF3C7;color:#92400E;}
.dep-v{font-size:18px;font-weight:700;margin-bottom:4px;}
.dep-s{font-size:12px;color:var(--muted);}
.dep-vends{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
.dep-vend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.vcod{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--bg2);color:var(--muted);font-weight:600;}

.sec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:1.75rem 0 .75rem;}
.sec:first-child{margin-top:0;}

.chart-wrap{position:relative;width:100%;height:200px;margin-bottom:1rem;}
.chart-wrap-sm{position:relative;width:100%;height:160px;margin-bottom:1rem;}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:1.25rem;}
.li{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
.ld{width:18px;height:3px;border-radius:2px;display:inline-block;}

.hbar-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:1.75rem;}
.hbar-row{display:flex;align-items:center;gap:10px;}
.hbar-name{font-size:13px;color:var(--muted);width:140px;text-align:right;flex-shrink:0;}
.hbar-track{flex:1;background:var(--bg2);border-radius:4px;height:22px;}
.hbar-fill{height:100%;border-radius:4px;}
.hbar-val{font-size:12px;color:var(--muted);min-width:65px;}

.trend-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.75rem;}
.trend-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;}
.trend-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}

.wf{display:flex;gap:6px;flex-wrap:wrap;}
.wf-btn{font-size:12px;padding:4px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;}
.wf-btn.on{background:var(--text);color:#fff;border-color:var(--text);}

.tw{overflow-x:auto;margin-bottom:1.75rem;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{background:var(--bg2);color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;text-align:right;border-bottom:2px solid var(--border);white-space:nowrap;}
.tbl th:first-child,.tbl th.l{text-align:left;}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;font-size:14px;white-space:nowrap;}
.tbl td:first-child,.tbl td.l{text-align:left;}
.tbl tr:hover td{background:#FAFBFF;}
.tbl tr.wk td{background:var(--bg2);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:5px 10px;}
.tbl tr.sub td{background:var(--bg2);font-weight:700;border-top:2px solid var(--border);}
.tbl tr.grand td{background:var(--bg2);font-weight:700;border-top:2px solid var(--border);}
.tbl tr.dhdr td{background:var(--bg2);font-size:12px;font-weight:600;color:var(--muted);padding:6px 10px;}
.tbl tr.dtot td{font-weight:700;border-top:1px solid var(--border);background:#F8F9FC;}
.zero{color:var(--border);}
.m{color:var(--muted);}
.badge-n{font-size:11px;background:#D1FAE5;color:#065F46;padding:2px 8px;border-radius:20px;font-weight:600;}

@media(max-width:640px){.mrow{grid-template-columns:repeat(2,1fr);}.trend-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div><h1>Dashboard de Ventas</h1><p id="subtitulo">Cargando...</p></div>
    <div class="hdr-r"><div id="mes-pills"></div></div>
  </div>
  <div id="loading"><div class="spinner"></div><p>Cargando datos...</p></div>
  <div id="err"></div>
  <div id="app" style="display:none;"></div>
</div>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxlwutvEjzE8JwE4Ilx1uBMOSaH6dVrewOptvf5DZvSD_vvcrTDj9wilbkaVp41_RWG/exec';
const DLIST = ['Tienda','CRM Detal','AutoParts','Taller','ML'];
const DCOL  = {Tienda:'#1D4ED8','CRM Detal':'#059669',AutoParts:'#6D28D9',Taller:'#B91C1C',ML:'#D97706'};
const DTAG  = {Tienda:'dt','CRM Detal':'dc',AutoParts:'da',Taller:'dtl',ML:'dm'};
const DLBL  = {Tienda:'Tienda','CRM Detal':'CRM Detal',AutoParts:'AutoParts',Taller:'Taller',ML:'Mercado Libre'};
const DVENDS = {
  Tienda:[['12','Kimex Azpirichaga'],['13','Carlos Pellico'],['34','Karina Hernandez']],
  'CRM Detal':[['84','Luis Ludert'],['85','Joanna'],['86','Alejandro'],['93','CRM Detal']],
  AutoParts:[['94','CRM AutoParts'],['95','Edgar Quiros'],['96','Daniel AutoParts']],
  Taller:[['26','Frank'],['28','Roger']],
  ML:[['90','Mercado Libre'],['92','ML Adicional']],
};
const DSHADES = {
  Tienda:['#1E3A8A','#1D4ED8','#3B82F6'],
  'CRM Detal':['#064E3B','#059669','#10B981','#34D399'],
  AutoParts:['#4C1D95','#6D28D9','#8B5CF6'],
  Taller:['#7F1D1D','#B91C1C'],
  ML:['#78350F','#D97706'],
};
const MESES_ES = {'01':'Enero','02':'Febrero','03':'Marzo','04':'Abril','05':'Mayo','06':'Junio','07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre'};
const DIAS_ES  = {1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie',6:'Sáb'};

let D=null, MES='', CHARTS=[];

const fmt  = v=>'$'+parseFloat(v||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = v=>{const n=parseFloat(v||0);return n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1000?'$'+Math.round(n/1000)+'K':'$'+Math.round(n);};
const mlbl = m=>{const[y,mo]=m.split('-');return(MESES_ES[mo]||mo)+' '+y;};
const dlbl = f=>{const dt=new Date(f+'T12:00:00');return(DIAS_ES[dt.getDay()]||'?')+' '+dt.getDate();};

function getWeek(f){
  const dt=new Date(f+'T12:00:00'),d=dt.getDate(),dw=dt.getDay();
  if(dw===0)return null;
  const p=new Date(dt.getFullYear(),dt.getMonth(),1).getDay();
  const ps=p===0?7:p===6?1:(7-p+1);
  if(d<=ps)return 1;
  return 2+Math.floor((d-ps-2)/7);
}

function weekLabel(s,m){
  const[y,mo]=m.split('-').map(Number);
  const dias=new Date(y,mo,0).getDate();
  let mn=99,mx=0;
  for(let d=1;d<=dias;d++){
    const f=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const w=getWeek(f);if(w===s){mn=Math.min(mn,d);mx=Math.max(mx,d);}
  }
  const names=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return`${mn} ${names[mo-1]} — ${mx} ${names[mo-1]}`;
}

// Generar todos los días laborables (lun-sáb) del mes
function allLabDays(m){
  const[y,mo]=m.split('-').map(Number);
  const dias=new Date(y,mo,0).getDate();
  const out=[];
  for(let d=1;d<=dias;d++){
    const f=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dw=new Date(f+'T12:00:00').getDay();
    if(dw>=1&&dw<=6)out.push(f);
  }
  return out;
}

function deptDays(m,dept){return Object.keys((D.porMes[m]||{})[dept]||{}).sort();}
function deptTotal(m,dept){
  return Object.values((D.porMes[m]||{})[dept]||{})
    .reduce((s,v)=>s+Object.values(v).reduce((a,b)=>a+b,0),0);
}
function deptDayTotal(m,dept,f){
  return Object.values(((D.porMes[m]||{})[dept]||{})[f]||{}).reduce((a,b)=>a+b,0);
}
function vendTotal(m,dept,f,vend){return(((D.porMes[m]||{})[dept]||{})[f]||{})[vend]||0;}
function vendCli(m,dept,f,vend){return((((D.clientes[m]||{})[dept]||{})[f])||{})[vend]||0;}
function vendNuev(m,dept,f,vend){return((((D.nuevos[m]||{})[dept]||{})[f])||{})[vend]||0;}
function deptDayCli(m,dept,f){
  return Object.values(((D.clientes[m]||{})[dept]||{})[f]||{}).reduce((a,b)=>a+b,0);
}
function deptDayNuev(m,dept,f){
  return Object.values(((D.nuevos[m]||{})[dept]||{})[f]||{}).reduce((a,b)=>a+b,0);
}
function weeksIn(m){
  const s=new Set();allLabDays(m).forEach(f=>{const w=getWeek(f);if(w)s.add(w);});
  return[...s].sort((a,b)=>a-b);
}

function destroyCharts(){CHARTS.forEach(c=>{try{c.destroy();}catch(e){}});CHARTS=[];}

function buildLine(id,datasets,labels){
  const el=document.getElementById(id);if(!el)return;
  const c=new Chart(el,{type:'line',data:{labels,datasets},options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,callbacks:{label:ctx=>ctx.dataset.label+': '+fmt(ctx.parsed.y)}}},
    scales:{x:{grid:{display:false},ticks:{color:'#6B7080',font:{size:12},maxRotation:45}},
            y:{grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'#6B7080',font:{size:12},callback:v=>fmtK(v)}}}}});
  CHARTS.push(c);
}

function buildHBar(id,items,shades){
  const el=document.getElementById(id);if(!el)return;
  const h=Math.max(100,items.length*42+50);
  el.parentElement.style.height=h+'px';
  const total=items.reduce((s,x)=>s+x[1],0);
  const c=new Chart(el,{type:'bar',
    data:{labels:items.map(x=>x[0]),datasets:[{data:items.map(x=>x[1]),backgroundColor:shades,borderRadius:4,barPercentage:.65}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      layout:{padding:{right:190}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>fmt(ctx.parsed.x)}}},
      scales:{x:{grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'#6B7080',font:{size:12},callback:v=>fmtK(v)}},
              y:{grid:{display:false},ticks:{color:'#1A1D2E',font:{size:13}}}},
      animation:{onComplete:function(){
        const{ctx,data}=this;const meta=this.getDatasetMeta(0);
        ctx.save();ctx.font='500 12px Inter,sans-serif';ctx.fillStyle='#6B7080';ctx.textAlign='left';ctx.textBaseline='middle';
        meta.data.forEach((bar,i)=>{
          const v=data.datasets[0].data[i];
          const pct=total>0?(v/total*100).toFixed(1):'0';
          ctx.fillText(fmt(v)+'  '+pct+'%',bar.x+8,bar.y);
        });
        ctx.restore();
      }}}});
  CHARTS.push(c);
}

// ── Consolidado ───────────────────────────────────────────
function renderCons(sem){
  const[y,mo]=MES.split('-').map(Number);
  const sems=weeksIn(MES);
  const semsShow=sem==='todas'?sems:[sem];
  const allDays=allLabDays(MES);
  const filtDays=sem==='todas'?allDays:allDays.filter(f=>getWeek(f)===sem);

  let html=`<table class="tbl"><thead><tr>
    <th class="l">Fecha</th>
    ${DLIST.map(d=>`<th><span class="dep-tag ${DTAG[d]}" style="font-size:10px;">${DLBL[d]}</span></th>`).join('')}
    <th>Total</th><th>Clientes</th><th>Nuevos</th>
  </tr></thead><tbody>`;

  semsShow.forEach(s=>{
    const sd=filtDays.filter(f=>getWeek(f)===s);
    if(!sd.length)return;
    html+=`<tr class="wk"><td colspan="${DLIST.length+3}">Semana ${s} — ${weekLabel(s,MES)}</td></tr>`;
    const sTots={};DLIST.forEach(d=>sTots[d]=0);
    let sAll=0,sCli=0,sNuev=0;

    sd.forEach(f=>{
      const dTots={};DLIST.forEach(d=>{dTots[d]=deptDayTotal(MES,d,f);});
      const dayAll=DLIST.reduce((s,d)=>s+dTots[d],0);
      // clientes y nuevos del día = suma por todos los deptos
      const dayCli=DLIST.reduce((s,d)=>s+deptDayCli(MES,d,f),0);
      const dayNuev=DLIST.reduce((s,d)=>s+deptDayNuev(MES,d,f),0);
      DLIST.forEach(d=>{sTots[d]+=dTots[d];});
      sAll+=dayAll;sCli+=dayCli;sNuev+=dayNuev;
      html+=`<tr><td>${dlbl(f)}</td>
        ${DLIST.map(d=>dTots[d]>0?`<td>${fmt(dTots[d])}</td>`:`<td class="zero">—</td>`).join('')}
        <td style="font-weight:600">${dayAll>0?fmt(dayAll):'<span class="zero">—</span>'}</td>
        <td>${dayCli||'<span class="zero">—</span>'}</td>
        <td>${dayNuev>0?`<span class="badge-n">${dayNuev}</span>`:dayCli?'0':'<span class="zero">—</span>'}</td>
      </tr>`;
    });

    html+=`<tr class="sub"><td>Subtotal Sem ${s}</td>
      ${DLIST.map(d=>`<td>${fmt(sTots[d])}</td>`).join('')}
      <td>${fmt(sAll)}</td><td>${sCli}</td>
      <td>${sNuev>0?`<span class="badge-n">${sNuev}</span>`:'0'}</td></tr>`;
  });

  if(sem==='todas'){
    const gTots={};DLIST.forEach(d=>gTots[d]=deptTotal(MES,d));
    const gAll=DLIST.reduce((s,d)=>s+gTots[d],0);
    const gCli=DLIST.reduce((s,d)=>s+Object.values((D.clientes[MES]||{})[d]||{}).reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0),0);
    const gNuev=DLIST.reduce((s,d)=>s+Object.values((D.nuevos[MES]||{})[d]||{}).reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0),0);
    html+=`<tr class="grand"><td>Total ${mlbl(MES)}</td>
      ${DLIST.map(d=>`<td>${fmt(gTots[d])}</td>`).join('')}
      <td>${fmt(gAll)}</td><td>${gCli}</td>
      <td>${gNuev>0?`<span class="badge-n">${gNuev}</span>`:'0'}</td></tr>`;
  }
  html+='</tbody></table>';
  const el=document.getElementById('cons-table');if(el)el.innerHTML=html;
}

// ── Resumen diario ────────────────────────────────────────
function buildResumenDiario(){
  const allDays=allLabDays(MES).filter(f=>DLIST.some(d=>deptDayTotal(MES,d,f)>0));
  // Mostrar último día con datos
  if(!allDays.length)return'<p style="color:var(--muted);padding:1rem 0;">Sin datos.</p>';
  const f=allDays[allDays.length-1];
  const rows=[];
  DLIST.forEach(dept=>{
    const vendDia=(D.porMes[MES]||{})[dept]?.[f]||{};
    Object.entries(vendDia).sort((a,b)=>b[1]-a[1]).forEach(([vend,neto])=>{
      if(neto>0) rows.push({dept,vend,neto,
        cli:vendCli(MES,dept,f,vend),
        nuev:vendNuev(MES,dept,f,vend)});
    });
  });
  rows.sort((a,b)=>b.neto-a.neto);
  const totNeto=rows.reduce((s,r)=>s+r.neto,0);
  const totCli=rows.reduce((s,r)=>s+r.cli,0);
  const totNuev=rows.reduce((s,r)=>s+r.nuev,0);

  let html=`<table class="tbl"><thead><tr>
    <th class="l">Vendedor</th><th class="l">Depto</th>
    <th>Monto ($)</th><th>Clientes</th><th>Nuevos</th>
  </tr></thead><tbody>
  <tr class="dhdr"><td colspan="5">${dlbl(f)} ${f} — <strong>${fmt(totNeto)}</strong> total empresa</td></tr>`;
  rows.forEach(r=>{
    html+=`<tr><td>${r.vend}</td><td><span class="dep-tag ${DTAG[r.dept]}" style="font-size:10px;">${DLBL[r.dept]}</span></td>
      <td>${fmt(r.neto)}</td><td>${r.cli||'<span class="zero">—</span>'}</td>
      <td>${r.nuev>0?`<span class="badge-n">${r.nuev}</span>`:r.cli?'0':'<span class="zero">—</span>'}</td></tr>`;
  });
  html+=`<tr class="dtot"><td colspan="2">Total día</td><td>${fmt(totNeto)}</td>
    <td>${totCli}</td><td>${totNuev>0?`<span class="badge-n">${totNuev}</span>`:'0'}</td></tr>
  </tbody></table>`;
  return html;
}

// ── Vista depto ───────────────────────────────────────────
function buildDeptView(dept){
  const color=DCOL[dept];
  const allDays=allLabDays(MES);
  const sems=weeksIn(MES);

  // Totales del depto
  const total=deptTotal(MES,dept);
  const diasActivos=deptDays(MES,dept).length;
  const totalCli=Object.values((D.clientes[MES]||{})[dept]||{})
    .reduce((s,v)=>s+Object.values(v).reduce((a,b)=>a+b,0),0);
  const totalNuev=Object.values((D.nuevos[MES]||{})[dept]||{})
    .reduce((s,v)=>s+Object.values(v).reduce((a,b)=>a+b,0),0);

  // Vendedores totales
  const vendTots={};
  allDays.forEach(f=>{
    Object.entries((D.porMes[MES]||{})[dept]?.[f]||{}).forEach(([v,n])=>{vendTots[v]=(vendTots[v]||0)+n;});
  });
  const vendList=Object.entries(vendTots).sort((a,b)=>b[1]-a[1]);

  // Gráfico lun-sáb
  const lineData=allDays.map(f=>deptDayTotal(MES,dept,f));

  let html=`
  <div class="mrow" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));">
    <div class="mc"><div class="mc-l">Total</div><div class="mc-v" style="color:${color}">${fmt(total)}</div></div>
    <div class="mc"><div class="mc-l">Clientes</div><div class="mc-v">${totalCli}</div><div class="mc-s">únicos</div></div>
    <div class="mc"><div class="mc-l">Clientes nuevos</div><div class="mc-v" style="color:var(--c-green)">${totalNuev}</div></div>
    <div class="mc"><div class="mc-l">Días activos</div><div class="mc-v">${diasActivos}</div></div>
    <div class="mc"><div class="mc-l">Promedio diario</div><div class="mc-v">${fmt(total/(diasActivos||1))}</div></div>
  </div>

  <div class="sec">Evolución diaria — lunes a sábado</div>
  <div class="chart-wrap"><canvas id="line_${dept.replace(/\s/g,'_')}"></canvas></div>

  <div class="sec">Por vendedor — período completo</div>
  <div style="position:relative;width:100%;"><canvas id="hbar_${dept.replace(/\s/g,'_')}"></canvas></div>

  <div class="sec">Desglose diario por vendedor</div>
  <div class="tw">`;

  // Tabla desglose por semana → día → vendedor
  html+=`<table class="tbl"><thead><tr>
    <th class="l">Vendedor</th><th>Monto ($)</th><th>Clientes</th><th>Nuevos</th>
  </tr></thead><tbody>`;

  sems.forEach(s=>{
    const sd=allDays.filter(f=>getWeek(f)===s&&deptDayTotal(MES,dept,f)>0);
    if(!sd.length)return;
    let semNeto=0,semCli=0,semNuev=0;
    html+=`<tr class="wk"><td colspan="4">Semana ${s} — ${weekLabel(s,MES)}</td></tr>`;

    sd.forEach(f=>{
      const vendDia=(D.porMes[MES]||{})[dept]?.[f]||{};
      const vList=Object.entries(vendDia).sort((a,b)=>b[1]-a[1]);
      const dayNeto=vList.reduce((s,x)=>s+x[1],0);
      const dayCli=deptDayCli(MES,dept,f);
      const dayNuev=deptDayNuev(MES,dept,f);
      semNeto+=dayNeto;semCli+=dayCli;semNuev+=dayNuev;

      html+=`<tr class="dhdr"><td colspan="4">${dlbl(f)} — ${fmt(dayNeto)} total día</td></tr>`;
      vList.forEach(([vend,neto])=>{
        const vc=vendCli(MES,dept,f,vend);
        const vn=vendNuev(MES,dept,f,vend);
        html+=`<tr><td>${vend}</td><td>${fmt(neto)}</td>
          <td>${vc||'<span class="zero">—</span>'}</td>
          <td>${vn>0?`<span class="badge-n">${vn}</span>`:vc?'0':'<span class="zero">—</span>'}</td></tr>`;
      });
      html+=`<tr class="dtot"><td>Total día</td><td>${fmt(dayNeto)}</td>
        <td>${dayCli||'<span class="zero">—</span>'}</td>
        <td>${dayNuev>0?`<span class="badge-n">${dayNuev}</span>`:dayCli?'0':'<span class="zero">—</span>'}</td></tr>`;
    });

    html+=`<tr class="sub"><td>Subtotal Sem ${s}</td><td>${fmt(semNeto)}</td>
      <td>${semCli}</td><td>${semNuev>0?`<span class="badge-n">${semNuev}</span>`:'0'}</td></tr>`;
  });

  // Total período
  html+=`<tr class="grand"><td>Total ${mlbl(MES)}</td><td>${fmt(total)}</td>
    <td>${totalCli}</td><td>${totalNuev>0?`<span class="badge-n">${totalNuev}</span>`:'0'}</td></tr>`;

  html+='</tbody></table></div>';
  return{html,lineData,allDays,vendList,color};
}

// ── Render principal ──────────────────────────────────────
function render(mes){
  destroyCharts();
  MES=mes;

  const allDays=allLabDays(mes);
  const sems=weeksIn(mes);
  const totalEmpresa=DLIST.reduce((s,d)=>s+deptTotal(mes,d),0);
  const totalCli=DLIST.reduce((s,d)=>s+Object.values((D.clientes[mes]||{})[d]||{})
    .reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0),0);
  const totalNuev=DLIST.reduce((s,d)=>s+Object.values((D.nuevos[mes]||{})[d]||{})
    .reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0),0);
  const diasActivos=new Set(DLIST.flatMap(d=>deptDays(mes,d))).size;

  document.getElementById('subtitulo').textContent='Multiservicios Dakar C.A. — '+mlbl(mes);

  // Línea multi-depto para resumen
  const lineDatasets=DLIST.filter(d=>deptDays(mes,d).length).map(d=>({
    label:DLBL[d],
    data:allDays.map(f=>deptDayTotal(mes,d,f)),
    borderColor:DCOL[d],
    backgroundColor:DCOL[d]+'10',
    borderWidth:2,pointRadius:3,pointHoverRadius:6,fill:false,tension:.35,
  }));

  // Tendencia por mes
  const mesesTend=D.meses.slice().reverse();
  const tendLabels=mesesTend.map(m=>mlbl(m).split(' ')[0]);
  const tendNuev=mesesTend.map(m=>DLIST.reduce((s,d)=>s+Object.values((D.nuevos[m]||{})[d]||{})
    .reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0),0));

  let html=`
  <div class="tab-bar">
    <button class="tab on" onclick="switchTab('resumen',this)">Resumen</button>
    ${DLIST.map(d=>`<button class="tab" onclick="switchTab('${d.replace(/\s/g,'_')}',this)">${DLBL[d]}</button>`).join('')}
  </div>

  <!-- RESUMEN -->
  <div class="tab-panel on" id="panel-resumen">
    <div class="mrow">
      <div class="mc"><div class="mc-l">Total facturado</div><div class="mc-v">${fmt(totalEmpresa)}</div><div class="mc-s">${mlbl(mes)}</div></div>
      <div class="mc"><div class="mc-l">Clientes atendidos</div><div class="mc-v">${totalCli}</div><div class="mc-s">visitas únicas</div></div>
      <div class="mc"><div class="mc-l">Clientes nuevos</div><div class="mc-v" style="color:var(--c-green)">${totalNuev}</div><div class="mc-s">${totalCli>0?Math.round(totalNuev/totalCli*100):0}% del total</div></div>
      <div class="mc"><div class="mc-l">Días activos</div><div class="mc-v">${diasActivos}</div><div class="mc-s">lun — sáb</div></div>
      <div class="mc"><div class="mc-l">Promedio diario</div><div class="mc-v">${fmt(totalEmpresa/(diasActivos||1))}</div></div>
    </div>

    <div class="sec">Por departamento</div>
    <div class="dep-row">
      ${DLIST.map(d=>{
        const t=deptTotal(mes,d);
        const dc=DLIST.reduce((s,x)=>x===d?s+Object.values((D.clientes[mes]||{})[x]||{}).reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0):s,0);
        const dn=DLIST.reduce((s,x)=>x===d?s+Object.values((D.nuevos[mes]||{})[x]||{}).reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0):s,0);
        return`<div class="dep-card">
          <div class="dep-tag ${DTAG[d]}">${DLBL[d]}</div>
          <div class="dep-v">${fmt(t)}</div>
          <div class="dep-s">${dc} clientes · <span style="color:var(--c-green)">${dn} nuevos</span></div>
          <div class="dep-vends">${(DVENDS[d]||[]).map(([cod,nom])=>`<div class="dep-vend"><span class="vcod">${cod}</span>${nom}</div>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="sec">Evolución diaria — lunes a sábado</div>
    <div class="chart-wrap"><canvas id="line_resumen"></canvas></div>
    <div class="leg">
      ${DLIST.map(d=>`<div class="li"><span class="ld" style="background:${DCOL[d]};"></span>${DLBL[d]}</div>`).join('')}
    </div>

    <div class="sec">Tendencia — clientes nuevos captados</div>
    <div class="trend-row">
      <div class="trend-card">
        <div class="trend-title">Nuevos por mes</div>
        <div class="chart-wrap-sm"><canvas id="bar_tendencia"></canvas></div>
      </div>
      <div class="trend-card">
        <div class="trend-title">Nuevos por departamento — ${mlbl(mes)}</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px;" id="nuev-depto">
          ${DLIST.map(d=>{
            const dn=Object.values((D.nuevos[mes]||{})[d]||{}).reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0);
            const pct=totalNuev>0?Math.round(dn/totalNuev*100):0;
            return`<div style="display:flex;align-items:center;gap:8px;font-size:13px;">
              <span style="flex:1;color:var(--muted);">${DLBL[d]}</span>
              <div style="width:100px;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;">
                <div style="width:${pct}%;height:100%;background:${DCOL[d]};border-radius:4px;"></div>
              </div>
              <span style="font-weight:500;min-width:25px;">${dn}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="sec" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <span>Consolidado semanal</span>
      <div class="wf">
        <button class="wf-btn on" onclick="filtrarSem('todas',this)">Todas</button>
        ${sems.map(s=>`<button class="wf-btn" onclick="filtrarSem(${s},this)">Sem ${s}</button>`).join('')}
      </div>
    </div>
    <div class="tw" id="cons-table"></div>

    <div class="sec">Resumen del día</div>
    <div class="tw">${buildResumenDiario()}</div>
  </div>`;

  // PESTAÑAS POR DEPTO
  DLIST.forEach(dept=>{
    const key=dept.replace(/\s/g,'_');
    const{html:dhtml}=buildDeptView(dept);
    html+=`<div class="tab-panel" id="panel-${key}">${dhtml}</div>`;
  });

  document.getElementById('app').innerHTML=html;
  renderCons('todas');

  requestAnimationFrame(()=>{
    // Resumen line
    buildLine('line_resumen',lineDatasets,allDays.map(dlbl));

    // Tendencia barras
    const tendEl=document.getElementById('bar_tendencia');
    if(tendEl){
      const c=new Chart(tendEl,{type:'bar',
        data:{labels:tendLabels,datasets:[{data:tendNuev,backgroundColor:tendLabels.map((_,i)=>i===tendLabels.length-1?'#059669':'#D1FAE5'),borderRadius:4}]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'Nuevos: '+ctx.parsed.y}}},
          scales:{x:{grid:{display:false},ticks:{color:'#6B7080',font:{size:12}}},
                  y:{grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'#6B7080',font:{size:12}}}}}});
      CHARTS.push(c);
    }

    // Depto charts
    DLIST.forEach(dept=>{
      const key=dept.replace(/\s/g,'_');
      const{lineData,allDays:ad,vendList,color}=buildDeptView(dept);
      buildLine('line_'+key,[{
        label:DLBL[dept],data:lineData,borderColor:color,backgroundColor:color+'15',
        borderWidth:2.5,pointRadius:3,pointHoverRadius:6,fill:true,tension:.35,
      },{
        label:'Promedio',
        data:Array(lineData.length).fill(Math.round(lineData.reduce((a,b)=>a+b,0)/(lineData.filter(v=>v>0).length||1))),
        borderColor:'rgba(107,112,128,0.35)',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false,
      }],ad.map(dlbl));
      if(vendList.length) buildHBar('hbar_'+key,vendList,DSHADES[dept]||['#6B7080']);
    });
  });
}

function filtrarSem(sem,btn){
  document.querySelectorAll('.wf-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');renderCons(sem);
}
function switchTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('panel-'+id).classList.add('on');
}
function cambiarMes(mes,btn){
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');render(mes);
}

async function boot(){
  try{
    const r=await fetch(ENDPOINT);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(data.error)throw new Error(data.error);
    D=data;
    const meses=D.meses||[];
    if(!meses.length)throw new Error('Sin datos');
    document.getElementById('mes-pills').innerHTML=meses.map((m,i)=>
      `<div class="pill${i===0?' on':''}" onclick="cambiarMes('${m}',this)">${mlbl(m)}</div>`
    ).join('');
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    render(meses[0]);
  }catch(e){
    document.getElementById('loading').style.display='none';
    const el=document.getElementById('err');
    el.style.display='block';el.textContent='Error: '+e.message;
  }
}
boot();
</script>
</body>
</html>
